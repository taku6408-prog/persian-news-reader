<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペルシャ語ニュースリーダー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .article-card { margin-bottom: 20px; transition: transform 0.2s; }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .persian-text { direction: rtl; font-family: 'Tahoma', sans-serif; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Persian News Reader</a>
            <button class="btn btn-outline-light btn-sm" onclick="fetchArticles()">最新情報を取得</button>
        </div>
    </nav>

    <div class="container">
        <div id="status-message" class="alert alert-info d-none"></div>
        <div class="row" id="articles-container">
            {% for article in articles %}
            <div class="col-md-6 col-lg-4">
                <div class="card article-card h-100">
                    <div class="card-body">
                        <h5 class="card-title persian-text text-end">{{ article.title_original }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted small">
                            {{ article.feed_name }} | {{ article.published_at }}
                        </h6>
                        <p class="card-text persian-text text-end">{{ article.summary_original | truncate(150) }}</p>
                    </div>
                    <div class="card-footer bg-white border-top-0 text-end">
                        <a href="{{ article.link }}" target="_blank" class="btn btn-sm btn-primary">続きを読む</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        async function fetchArticles() {
            const btn = event.target;
            const status = document.getElementById('status-message');
            
            btn.disabled = true;
            status.textContent = '記事を取得中...';
            status.classList.remove('d-none');

            try {
                const resp = await fetch('/api/fetch');
                const data = await resp.json();
                status.textContent = `完了: 新着記事 ${data.new_articles} 件を取得しました。ページを更新します。`;
                setTimeout(() => location.reload(), 2000);
            } catch (err) {
                status.textContent = 'エラーが発生しました。';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
